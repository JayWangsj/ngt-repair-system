name: Publish Windows studio release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Validate release version
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
      - name: Wait for successful verification
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(35)
          do {
            $runs = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --event push --limit 1 --json status,conclusion,url | ConvertFrom-Json
            if ($runs.Count -gt 0) {
              $run = $runs[0]
              if ($run.status -eq "completed") {
                if ($run.conclusion -ne "success") {
                  throw "Verification failed: $($run.url)"
                }
                Write-Host "Verification succeeded: $($run.url)"
                exit 0
              }
              Write-Host "Verification is $($run.status); waiting..."
            } else {
              Write-Host "Verification run is not available yet; waiting..."
            }
            Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $deadline)
          throw "Timed out waiting for Verify MVP on commit $env:GITHUB_SHA."
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted --config.package-import-method=copy
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ngt:release-only@127.0.0.1:55432/ngt?schema=public
          AUTH_SECRET: release-only-secret
          AUTH_URL: http://127.0.0.1:3000
          AUTH_TRUST_HOST: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=2048
      - shell: powershell
        run: ./scripts/build-windows-studio-package.ps1
      - name: Smoke test packaged studio
        shell: powershell
        run: ./scripts/test-windows-studio-package.ps1 -IntegrityOnly
      - shell: powershell
        run: |
          choco install innosetup --no-progress --yes
          ./scripts/build-windows-studio-installer.ps1
      - shell: powershell
        run: ./scripts/prepare-windows-studio-update-assets.ps1
      - shell: powershell
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedNames = @(
            "ngt-studio-windows-v$version.zip",
            "ngt-studio-windows-v$version.zip.sha256",
            "ngt-studio-runtime-v$version.zip",
            "ngt-studio-runtime-v$version.zip.sha256",
            "ngt-studio-windows-setup-v$version.exe",
            "ngt-studio-windows-setup-v$version.exe.sha256"
          ) | Sort-Object
          $assetFiles = @(Get-ChildItem -LiteralPath dist -File | Sort-Object Name)
          $actualNames = @($assetFiles | ForEach-Object Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames) {
            throw "The release asset set is incomplete or contains unexpected files."
          }
          foreach ($checksumFile in $assetFiles | Where-Object { $_.Name.EndsWith(".sha256") }) {
            $checksum = Get-Content -LiteralPath $checksumFile.FullName -Raw
            $match = [regex]::Match($checksum, "(?m)^([A-Fa-f0-9]{64})\s+(.+?)\s*$")
            if (-not $match.Success) {
              throw "Invalid release checksum file: $($checksumFile.Name)"
            }
            $expectedHash = $match.Groups[1].Value
            $targetName = $match.Groups[2].Value
            $asset = Join-Path $checksumFile.DirectoryName $targetName
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Checksum target is missing for $($checksumFile.Name)."
            }
            if ((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash -ne $expectedHash) {
              throw "Release checksum does not match $($checksumFile.Name)."
            }
          }
          $assets = @($assetFiles | Select-Object -ExpandProperty FullName)
          $existingRelease = $null
          $releaseEndpoint = "repos/JayWangsj/ngt-repair-system/releases/tags/$env:GITHUB_REF_NAME"
          $releaseListEndpoint = "repos/JayWangsj/ngt-repair-system/releases?per_page=100"
          $releasesJson = gh api $releaseListEndpoint
          if ($LASTEXITCODE -ne 0) { throw "Unable to list existing releases." }
          $existingReleases = @(
            $releasesJson | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
          )
          if ($existingReleases.Count -gt 1) {
            throw "Multiple releases exist for $env:GITHUB_REF_NAME."
          }
          if ($existingReleases.Count -eq 1) {
            $existingRelease = $existingReleases[0]
            if (-not ($existingRelease.draft)) {
              throw "Release $env:GITHUB_REF_NAME already exists; published versions are never overwritten."
            }
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw "Draft release preparation failed." }
            $releasesJson = gh api $releaseListEndpoint
            if ($LASTEXITCODE -ne 0) { throw "Unable to verify prepared draft release assets." }
            $draftReleases = @(
              $releasesJson | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
            )
            if (($draftReleases.Count -ne 1) -or (-not ($draftReleases[0].draft))) {
              throw "Prepared draft release could not be found."
            }
            $existingRelease = $draftReleases[0]
          }
          $draft = $existingRelease
          if (-not ($draft.draft)) { throw "Prepared release is unexpectedly public." }
          $localAssets = @($assetFiles | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}`t{1}`tsha256:{2}" -f $_.Name, $_.Length, $hash
          } | Sort-Object)
          $remoteAssets = @()
          $remoteDigestsReady = $false
          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            $releasesJson = gh api $releaseListEndpoint
            if ($LASTEXITCODE -ne 0) { throw "Unable to verify prepared draft release assets." }
            $draftReleases = @(
              $releasesJson | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
            )
            if (($draftReleases.Count -ne 1) -or (-not ($draftReleases[0].draft))) {
              throw "Prepared draft release could not be found."
            }
            $draft = $draftReleases[0]
            $remoteAssets = @($draft.assets | ForEach-Object {
              "{0}`t{1}`t{2}" -f $_.name, $_.size, $_.digest
            } | Sort-Object)
            $missingDigests = @($remoteAssets | Where-Object { $_ -notmatch "`tsha256:[a-f0-9]{64}$" })
            $remoteDigestsReady = ($remoteAssets.Count -eq $localAssets.Count) -and ($missingDigests.Count -eq 0)
            if ($remoteDigestsReady) { break }
            if ($attempt -lt 11) { Start-Sleep -Seconds 5 }
          }
          if (-not $remoteDigestsReady) {
            throw "GitHub did not calculate SHA256 digests for all draft release assets."
          }
          if (Compare-Object -ReferenceObject $localAssets -DifferenceObject $remoteAssets) {
            throw "Draft release asset names, sizes, or SHA256 digests do not match the verified local assets."
          }
          gh release edit $env:GITHUB_REF_NAME --draft=false --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Verified release could not be published." }
          $publishedJson = gh api $releaseEndpoint
          if ($LASTEXITCODE -ne 0) { throw "Published release could not be verified." }
          $published = $publishedJson | ConvertFrom-Json
          if ($published.draft) { throw "Release remained a draft after publishing." }
          $publishedAssets = @($published.assets | ForEach-Object {
            "{0}`t{1}`t{2}" -f $_.name, $_.size, $_.digest
          } | Sort-Object)
          if (Compare-Object -ReferenceObject $localAssets -DifferenceObject $publishedAssets) {
            throw "Published release asset names, sizes, or SHA256 digests do not match the verified local assets."
          }
          if (-not $published.immutable) {
            Write-Warning "This repository does not enforce immutable releases; external repository settings are still required to prevent post-publication changes."
          }
          Write-Host "Published verified release: $($published.html_url)"
        env:
          GH_TOKEN: ${{ github.token }}
